name: CI

on:
  push:
    branches: [development, master, 'release/**', 'hotfix/**']
  pull_request:
    branches: [development, master, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No dependencies to install; the checks use Node built-ins only.
      - run: npm test
